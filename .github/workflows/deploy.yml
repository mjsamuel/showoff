name: Deploy

# main deploys the prod stage; each same-repo PR gets a pr-<number> preview
# stage that is destroyed when the PR closes

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  # Queue instead of cancelling: a half-finished deploy or teardown leaves
  # Alchemy state out of sync. Only the newest pending run is kept.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Fork PRs get no secrets
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # --yes approves the plan without a terminal; explicit bash adds pipefail
      # The API token is only handed to the steps that need it, not to installs,
      # lint or tests, where dependency code also runs
      - name: Deploy
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec alchemy deploy --stage "$STAGE" --yes 2>&1 | tee deploy.log
          # A missing match must not fail the deploy
          url=$(grep -oE "https://[^' ]+\.workers\.dev" deploy.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed **$STAGE** to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Preview (\`$STAGE\`, ${{ github.event.pull_request.head.sha }}): $URL"

  destroy:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to destroy prod
        run: test "$STAGE" != prod
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec alchemy destroy --stage "$STAGE" --yes
